services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urp
      POSTGRES_USER: urp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urp_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - urp-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urp -d urp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  urp-postgres-dev:
