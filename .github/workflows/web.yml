name: Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Install, lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm --filter @urp/web lint
      - name: Typecheck
        run: pnpm --filter @urp/web typecheck
      - name: Test
        run: pnpm --filter @urp/web test
      - name: Build
        run: pnpm --filter @urp/web build
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: urp-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7
