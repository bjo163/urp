name: Rust

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/api/**"
      - "crates/**"
      - ".github/workflows/rust.yml"
      - "migrations/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/api/**"
      - "crates/**"
      - ".github/workflows/rust.yml"
      - "migrations/**"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: urp_migration_test
          POSTGRES_USER: urp
          POSTGRES_PASSWORD: urp_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urp -d urp_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      URP_MIGRATION_TEST_DATABASE_URL: postgresql://urp:urp_ci_only@localhost:5432/urp_migration_test
      URP_TEST_DATABASE_URL: postgresql://urp:urp_ci_only@localhost:5432/urp_migration_test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

      - name: Generate OpenAPI contract
        run: |
          mkdir -p target/openapi
          cargo run -p urp-api -- --print-openapi > target/openapi/openapi.json
          python -m json.tool target/openapi/openapi.json > /dev/null

      - name: Verify deterministic OpenAPI generation
        run: |
          cargo run -p urp-api -- --print-openapi > target/openapi/openapi-second.json
          cmp target/openapi/openapi.json target/openapi/openapi-second.json

      - name: Upload canonical OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: urp-openapi
          path: target/openapi/openapi.json
          if-no-files-found: error
      - name: Preserve generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: urp-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
