[workspace]
resolver = "3"
members = [
  "apps/api",
  "crates/kernel",
  "crates/storage",
  "crates/events",
]

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
authors = ["URP Contributors"]
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "sqlite-bundled", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
expect_used = "warn"
